<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Counter: Groups Multiplication Sandbox</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./../../css/dropdown.css">
    <link rel="stylesheet" href="./../../css/topbar.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div class="game-window">
        <div class="parent-config">
            <div class="parent-title">⚙️ Parent Management Dashboard (Multiplication "Groups Of" Mode)</div>
            <div class="parent-settings-row">
                <div class="parent-input-group">
                    <label style="font-weight:bold; color:#d35400;">Child Name:</label>
                    <input type="text" class="parent-input name-input" id="parent-child-name" placeholder="Superstar" maxlength="12">
                </div>

                <div class="emoji-selector" id="emoji-board">
                    <div class="emoji-opt selected" data-emoji="🍎">🍎</div>
                    <div class="emoji-opt" data-emoji="🦖">🦖</div>
                    <div class="emoji-opt" data-emoji="🧸">🧸</div>
                    <div class="emoji-opt" data-emoji="🦄">🦄</div>
                    <div class="emoji-opt" data-emoji="🚗">🚗</div>
                    <div class="emoji-opt" data-emoji="🍩">🍩</div>
                </div>

                <div class="parent-input-group">
                    <label style="font-weight:bold; color:#d35400;">Equation:</label>
                    <input type="number" class="parent-input num-input" id="parent-input-a" min="1" max="5" placeholder="Groups">
                    <span style="font-weight:bold; font-size: 1.2rem;">×</span>
                    <input type="number" class="parent-input num-input" id="parent-input-b" min="1" max="6" placeholder="Items">
                    <button class="btn-parent-load" id="parent-load-btn">Load</button>
                </div>
            </div>
        </div>

        <div class="game-header">
            <div class="badge q-badge" id="q-tracker">Question: 1 / 10</div>
            <div class="child-greeting" id="greeting-banner">Let's multiply, Superstar!</div>
            <div class="badge score-badge" id="score-tracker">Stars: ⭐ 0</div>
        </div>

        <div class="worksheet-grid">
            
            <div class="column-math-stack">
                <div class="math-sign"></div>
                <div class="big-number" id="num-display-a">3</div>

                <div class="math-sign">×</div>
                <div class="big-number" id="num-display-b">4</div>
            </div>

            <div class="sandbox-box">
                <div class="baskets-grid" id="baskets-container">
                    </div>
                <div class="sandbox-controls">
                    <button class="btn-action btn-add" id="action-add">✚ Add 1 to Each Group</button>
                    <button class="btn-action btn-remove" id="action-remove">━ Remove 1 From Each</button>
                </div>
            </div>

            <div class="worksheet-line"></div>

            <div class="answer-row-wrapper">
                <span class="input-label">Count all objects across all baskets:</span>
                <input type="number" class="input-box" id="player-input" min="0" placeholder="?">
                <button class="btn-action btn-submit" id="action-check">Check Answer</button>
            </div>
        </div>
    </div>

    <div class="modal-screen" id="victory-modal">
        <div class="modal-card">
            <h2 id="modal-title">Correct! 🎉</h2>
            <p id="modal-desc">Brilliant multiplication work!</p>
            <button class="btn-action btn-submit" id="action-next" style="box-shadow:none; background-color:var(--accent-purple);">Next Question ➔</button>
        </div>
    </div>

    <script src="./../../common/navbar.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
