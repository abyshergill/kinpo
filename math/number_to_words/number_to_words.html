<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun with Numbers & Words!</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./../../css/dropdown.css">
    <link rel="stylesheet" href="./../../css/topbar.css">

</head>
<body>

<div class="game-container">
    <h1>Math Words Playground! 🎈</h1>

    <!-- Parent Control Panel -->
    <div class="parent-panel">
        <h3>⚙️ Parents' Settings Zone</h3>
        
        <!-- Random Mode Selection -->
        <div class="setting-group">
            <label for="max-range">1. Game Range Practice:</label>
            <select id="max-range" onchange="resetToRandomGame()">
                <option value="10">1 to 10</option>
                <option value="100">1 to 100</option>
                <option value="1000">1 to 1,000</option>
                <option value="10000">1 to 10,000</option>
                <option value="100000">1 to 100,000</option>
                <option value="1000000">1 to 1,000,000</option>
            </select>
        </div>

        <!-- Custom Number Injector -->
        <div class="setting-group" style="margin-bottom: 0; border-top: 1px dashed #ccc; padding-top: 10px;">
            <label for="custom-number">2. Send Custom Number:</label>
            <div>
                <input type="number" id="custom-number" class="parent-input" min="1" max="1000000" placeholder="e.g. 742">
                <button class="parent-btn" onclick="injectCustomNumber()">Send 🚀</button>
            </div>
        </div>
    </div>

    <!-- Mode Selectors -->
    <div class="mode-toggle">
        <button id="btn-n2w" class="mode-btn active" onclick="setMode('N2W')">123 ➡️ ABC</button>
        <button id="btn-w2n" class="mode-btn" onclick="setMode('W2N')">ABC ➡️ 123</button>
    </div>

    <!-- Challenge Area -->
    <div class="question-box">
        <div id="custom-indicator" class="custom-badge" style="display:none;">Parent's Choice! ⭐</div>
        <div id="question" class="question-text">Loading...</div>
    </div>

    <!-- Kid Input -->
    <div class="input-area">
        <input type="text" id="user-answer" placeholder="Type your answer here!" autocomplete="off" onkeyup="handleKeyPress(event)">
    </div>

    <button class="action-btn" onclick="checkAnswer()">Check My Answer! ⭐</button>

    <!-- Feedback and Score -->
    <div id="feedback" class="feedback"></div>
    <div class="score-board">Stars Collected: <span id="score">0</span> ⭐</div>
</div>

<script src="./../../common/navbar.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
